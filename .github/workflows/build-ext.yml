name: Build Firefox Extension

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v1.3.1, etc.
  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  build-firefox:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install web-ext
        run: npm install -g web-ext
      
      - name: Get version from manifest
        id: get_version
        run: |
          VERSION=$(jq -r '.version' firefox/manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extension version: $VERSION"
      
      - name: Sign Firefox extension
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          web-ext sign --channel=unlisted --api-key="$AMO_API_KEY" --api-secret="$AMO_API_SECRET" --source-dir=firefox
        
      - name: List and rename extension file
        run: |
          echo "Listing files in firefox/web-ext-artifacts:"
          ls -la firefox/web-ext-artifacts/ || echo "Directory not found"
          
          # Find the signed .xpi file
          if [ -d "firefox/web-ext-artifacts" ]; then
            cd firefox/web-ext-artifacts
            XPIFILE=$(ls *.xpi 2>/dev/null | head -n 1)
            
            if [ -n "$XPIFILE" ]; then
              echo "Found file: $XPIFILE"
              mv "$XPIFILE" "mrm-downloader-${{ steps.get_version.outputs.version }}-firefox.xpi"
              echo "Renamed to: mrm-downloader-${{ steps.get_version.outputs.version }}-firefox.xpi"
            else
              echo "Error: No .xpi file found in web-ext-artifacts"
              exit 1
            fi
          else
            echo "Error: web-ext-artifacts directory not found"
            exit 1
          fi
      
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ## MRM Downloader v${{ steps.get_version.outputs.version }}
            
            ### Firefox Extension
            Download the `.xpi` file below and install it in Firefox.
            
            ### Installation
            1. Download the `.xpi` file
            2. Open Firefox and go to `about:addons`
            3. Click the gear icon and select "Install Add-on From File..."
            4. Select the downloaded `.xpi` file
            
            ### Changes
            See the commit history for details.
          draft: false
          prerelease: false
      
      - name: Upload Firefox Extension to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./firefox/web-ext-artifacts/mrm-downloader-${{ steps.get_version.outputs.version }}-firefox.xpi
          asset_name: mrm-downloader-${{ steps.get_version.outputs.version }}-firefox.xpi
          asset_content_type: application/x-xpinstall
      
      - name: Upload artifact for download
        uses: actions/upload-artifact@v4
        with:
          name: firefox-extension
          path: ./firefox/web-ext-artifacts/*.xpi
          retention-days: 30
